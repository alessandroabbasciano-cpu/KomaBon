[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32 @ 7.0.1
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200

board_build.partitions = partitions_16MB.csv
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_opi

lib_deps =
    zinggjm/GxEPD2 @ 1.6.9
    mathertel/OneButton @ 2.6.2
    bblanchon/ArduinoJson @ 6.21.6
    esphome/ESPAsyncWebServer-esphome @ 3.4.0
    esphome/AsyncTCP-esphome @ 2.1.4
    tzapu/WiFiManager @ 2.0.17
    bitbank2/unzipLIB @ 1.0.0
    https://github.com/thijse/Arduino-Log.git#02e1d5dbd48dfbd601aaadce855c6c7a17abc5ec
    rweather/Crypto @ 0.4.0
    greiman/SdFat @ ^2.2.2

build_unflags = 
    -std=gnu++11
    -Os

build_flags =
    -D BOARD_SEEED_XIAO_ESP32S3
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -D ENABLE_ARDUINO_FS=1
    -I include
    -std=gnu++17
    -O3 
    -fno-var-tracking-assignments

board_build.filesystem = littlefs