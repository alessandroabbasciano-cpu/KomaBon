<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KomaBon Raw 1-Bit Converter</title>
    <style>
        body { font-family: monospace; background: #121212; color: #eee; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #1e1e1e; padding: 24px; border-radius: 8px; border: 1px solid #333; }
        h3 { margin-top: 0; color: #fff; }
        .dropzone { border: 2px dashed #555; padding: 30px; text-align: center; cursor: pointer; margin-bottom: 20px; background: #181818; }
        .dropzone:hover { border-color: #2979ff; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; color: #aaa; }
        input[type=range], input[type=text] { width: 100%; box-sizing: border-box; background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 6px; }
        .canvas-container { display: flex; gap: 20px; margin-top: 20px; align-items: flex-end; }
        canvas { border: 1px solid #444; background: #fff; image-rendering: pixelated; }
        button { width: 100%; padding: 12px; background: #2979ff; color: #fff; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; border-radius: 4px; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
<div class="container">
    <h3>KomaBon Raw 1-Bit Converter</h3>
    <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">Trascina SVG o PNG qui</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <label>Nome Array C++:</label>
    <input type="text" id="arrayName" value="icon_bits">

    <label>Scala Immagine: <span id="scaleVal">100</span>%</label>
    <input type="range" id="scale" min="50" max="100" value="100">

    <label>Soglia Luminanza (agisce solo sui PNG): <span id="thVal">128</span></label>
    <input type="range" id="threshold" min="1" max="254" value="128">

    <div class="canvas-container">
        <div>
            <canvas id="cvs" width="160" height="160"></canvas>
            <div style="font-size:10px; color:#777; text-align:center; margin-top:4px;">160x160 Nativo</div>
        </div>
        <div>
            <canvas id="sim" width="60" height="60"></canvas>
            <div style="font-size:10px; color:#777; text-align:center; margin-top:4px;">Simulazione 60x60</div>
        </div>
    </div>

    <button onclick="saveFile()">Salva File .h</button>
</div>
<script>
    let srcImg = null;
    const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
    const sim = document.getElementById('sim'), simCtx = sim.getContext('2d');
    const scaleInp = document.getElementById('scale'), thInp = document.getElementById('threshold');

    document.querySelectorAll('input[type=range]').forEach(el => el.addEventListener('input', () => {
        document.getElementById('scaleVal').innerText = scaleInp.value;
        document.getElementById('thVal').innerText = thInp.value;
        render();
    }));

    document.getElementById('fileInput').addEventListener('change', e => {
        if(!e.target.files.length) return;
        let file = e.target.files[0];
        document.getElementById('arrayName').value = file.name.split('.')[0].replace(/[^a-zA-Z0-9]/g, '_') + "_bits";
        let r = new FileReader();
        r.onload = ev => {
            let i = new Image();
            i.onload = () => { srcImg = i; render(); };
            i.src = ev.target.result;
        };
        r.readAsDataURL(file);
    });

    document.getElementById('dropzone').addEventListener('dragover', e => { e.preventDefault(); e.target.style.borderColor = '#2979ff'; });
    document.getElementById('dropzone').addEventListener('dragleave', e => { e.target.style.borderColor = '#555'; });
    document.getElementById('dropzone').addEventListener('drop', e => {
        e.preventDefault();
        e.target.style.borderColor = '#555';
        if(e.dataTransfer.files.length) {
            document.getElementById('fileInput').files = e.dataTransfer.files;
            document.getElementById('fileInput').dispatchEvent(new Event('change'));
        }
    });

    function render() {
        if(!srcImg) return;
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,160,160);
        let s = (scaleInp.value/100) * Math.min(160/srcImg.width, 160/srcImg.height);
        let w = srcImg.width * s, h = srcImg.height * s;
        ctx.drawImage(srcImg, (160-w)/2, (160-h)/2, w, h);

        let imgD = ctx.getImageData(0,0,160,160), d = imgD.data, th = thInp.value;
        for(let i=0; i<d.length; i+=4) {
            let lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
            let c = lum < th && d[i+3] > 128 ? 0 : 255;
            d[i] = d[i+1] = d[i+2] = c; d[i+3] = 255;
        }
        ctx.putImageData(imgD,0,0);

        simCtx.fillStyle = '#fff'; simCtx.fillRect(0,0,60,60);
        let simD = simCtx.createImageData(60,60);
        for(let y=0; y<60; y++) {
            for(let x=0; x<60; x++) {
                let sx = Math.floor(x*160/60), sy = Math.floor(y*160/60);
                let isBlk = d[(sy*160+sx)*4] === 0;
                let idx = (y*60+x)*4;
                simD.data[idx] = simD.data[idx+1] = simD.data[idx+2] = isBlk ? 0 : 255;
                simD.data[idx+3] = 255;
            }
        }
        simCtx.putImageData(simD,0,0);
    }

    function saveFile() {
        if(!srcImg) return;
        let d = ctx.getImageData(0,0,160,160).data, bytes = [];
        for(let y=0; y<160; y++) {
            for(let xB=0; xB<20; xB++) {
                let v=0;
                for(let b=0; b<8; b++) if(d[(y*160 + xB*8 + b)*4] === 0) v |= (1<<(7-b));
                bytes.push(v);
            }
        }
        let name = document.getElementById('arrayName').value || 'icon_bits';
        let out = `#pragma once\n#include <Arduino.h>\n\nconst uint8_t ${name}[] PROGMEM = {\n`;
        for(let i=0; i<160; i++) {
            out += "    " + bytes.slice(i*20, i*20+20).map(x=>"0x"+x.toString(16).padStart(2,'0').toUpperCase()).join(", ") + (i<159?",\n":"\n");
        }
        out += "};\n";
        let a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([out], {type:'text/plain'}));
        a.download = name.replace('_bits','') + '.h';
        a.click();
    }
</script>
</body>
</html>
